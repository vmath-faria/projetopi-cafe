<script>

    function entrar() {

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar === "" || senhaVar === "") {
            alert("Preencha todos os campos.");
            return;
        }

        fetch("/usuario/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        })
            .then(resposta => {
                if (!resposta.ok) {
                    alert("Usuário ou senha inválidos.");
                    return;
                }

                return resposta.json();
            })
            .then(json => {

                    if (!json) return;
                    console.log("Payload de autenticação:", json);

                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome_usuario;
                    sessionStorage.ID_USUARIO = json.id_usuario;
                    sessionStorage.NIVEL_ACESSO = json.nivel_acesso;
                    sessionStorage.ID_EMPRESA = json.id_empresa;
                    

                    if (json.nivel_acesso === "Proprietario") {
                        if (json.propriedades) {
                            sessionStorage.PROPRIEDADES = JSON.stringify(json.propriedades);
                        }
                    } else if (json.nivel_acesso === "Funcionario") {
                        sessionStorage.ID_PROPRIEDADE = json.id_propriedade;
                        sessionStorage.NOME_PROPRIEDADE = json.nome_propriedade;
                    }

                    if (json.nivel_acesso === "Proprietario") {
                        window.location.href = "dashboard_propriedades.html";
                    } else if (json.nivel_acesso === "Funcionario") {
                        window.location.href = "dashboard.html";
                    } else {
                        window.location.href = "bob.html";
                    }
                })
            .catch(err => console.error(err));
    }

</script>
