<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffech - Dashboard Proprietário</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" href="./imgs/logo-fundo-marrom.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="dashboard">

    <div class="header">
        <div class="container">
            <a href="index.html#"><img src="./imgs/logo-fonte-branca.png" class="titulo"></a>
            <div class="sla">
                <p id="header_nome">Olá!</p>
                <img src="./imgs/fotoperfil.png" class="foto">
                <select oninput="select_function()" class="select-dash" id="header_select">
                    <option selected disabled value="#"></option>
                    <option value="login" onclick="">Entrar com outra conta</option>
                    <option value="index" onclick="">Sair</option>
                </select>
            </div>
        </div>
    </div>

    <div class="saudacoes">
        <h1 id="saudacao">Bom dia!</h1>
        <h2>Visualize abaixo os dados sobre sua plantação de café arábica</h2>

        <!-- KPIs -->
        <div class="kpis">
            <div class="kpi">
                <h3>Umidade Média
                    <abbr title="Verde ideal 60~75%, Laranja 76~80%, Vermelho acima, Amarelo abaixo">
                        <img src="./imgs/iconeInformativo.png" alt="" style="width:16px;height:16px;margin-left:5px;">
                    </abbr>
                </h3>
                <span id="kpi_umidade" style="color: green;">--</span>
            </div>
            <div class="kpi">
                <h3>Faixa de Seca
                    <abbr title="Horário mais comum de seca"><img src="./imgs/iconeInformativo.png" alt="" style="width:16px;height:16px;margin-left:5px;"></abbr>
                </h3>
                <span id="kpi_temp">--</span>
            </div>
            <div class="kpi">
                <h3>Alertas de Secura
                    <abbr title="Talhões fora da umidade ideal"><img src="./imgs/iconeInformativo.png" alt="" style="width:16px;height:16px;margin-left:5px;"></abbr>
                </h3>
                <span id="kpi_alertas" style="color: red;">--</span>
            </div>
            <div class="kpi">
                <h3>Saúde da Plantação
                    <abbr title="Média da umidade dos talhões"><img src="./imgs/iconeInformativo.png" alt="" style="width:16px;height:16px;margin-left:5px;"></abbr>
                </h3>
                <span id="kpi_saude" style="color: green;">--</span>
            </div>
        </div>

        <h2>Selecione a propriedades desejada:</h2>
        <br>
        <div class="kpis" id="lista_fazendas"></div>
    </div>

</body>

</html>

<script>
const API = "http://localhost:3333";

document.addEventListener("DOMContentLoaded", async () => {
    const usuario = JSON.parse(localStorage.getItem("usuario"));

    if (!usuario) {
        window.location.href = "login.html";
        return;
    }

    if (usuario.nivel_acesso !== "Proprietario") {
        window.location.href = "dashboard.html";
        return;
    }

    document.getElementById("header_nome").textContent = `Olá, ${usuario.nome_usuario}`;
    document.getElementById("saudacao").textContent = `Bom dia, ${usuario.nome_usuario}!`;

    carregarFazendas();
});

async function carregarFazendas() {
    const usuario = JSON.parse(localStorage.getItem("usuario"));

    if (!usuario || !usuario.fk_empresa) {
        console.error("fk_empresa não encontrada");
        return;
    }

    try {
        const res = await fetch(`${API}/propriedade/empresa/${usuario.fk_empresa}`);
        const fazendas = await res.json();

        console.log("Fazendas carregadas:", fazendas);

        const container = document.getElementById("lista_fazendas");
        container.innerHTML = "";

        fazendas.forEach(f => {
            const card = document.createElement("div");
            card.className = "fazenda-card";
            card.style.width = "20%";
            card.innerHTML = `
                <img style="width:100px" src="${definirIcone(f.nivel_alerta)}">
                <br><b>${f.nome_propriedade}</b><br>${legendaAlerta(f.nivel_alerta)}
            `;
            card.onclick = () => {
                localStorage.setItem("id_propriedade", f.id_propriedade);
                window.location.href = "dashboard.html";
            };
            container.appendChild(card);
        });

    } catch (err) {
        console.error("Erro ao carregar fazendas", err);
    }
}




function definirIcone(nivel) {
    switch(nivel) {
        case "verde": return "imgs/fazenda_verde.png";
        case "amarelo": return "imgs/fazenda_amarelo.png";
        case "vermelho": return "imgs/fazenda_vermelho.png";
        default: return "imgs/fazenda_verde.png";
    }
}

function legendaAlerta(nivel) {
    if (nivel === "verde") return "Excelente";
    if (nivel === "amarelo") return "Atenção";
    return "Em risco";
}

function select_function() {
    const select = document.getElementById("header_select");
    const opts = select.options;

    for (let i = 0; i < opts.length; i++) {
        if (opts[i].selected) {
            if (opts[i].value === "index") {
                sessionStorage.clear();
                window.location.href = "index.html";
            } else if (opts[i].value === "login") {
                sessionStorage.clear();
                window.location.href = "login.html";
            }
        }
    }
}
</script>
