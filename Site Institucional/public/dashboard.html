<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffech Dashboard</title>
    <link rel="stylesheet" href="styles/dashboard.css">
    <link rel="icon" href="./imgs/logo-fundo-marrom.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="dashboard">

    <header>
        <div class="logo-header">
            <a href="index.html#"><img src="./imgs/logo-fonte-branca.png" class="titulo"></a>
        </div>
        <div class="header-usuario">
            <div class="boas-vindas">
                <p>Olá, <span id="b_usuario1">usuário</span>!</p>
                <img src="./imgs/fotoperfil.png" class="usuario-foto">
            </div>
            <select oninput="select_function()" class="select-dash" id="header_select">
                <option selected disabled value="#"></option>
                <option value="login">Entrar com outra conta</option>
                <option value="problema">Problemas?</option>
                <option value="requisicao">Pedidos?</option>
                <option value="index">Sair</option>
            </select>
        </div>
    </header>

    <div class="saudacoes">
        <h1 id="saudacao">Bom dia, <span id="b_usuario2">usuário</span>!</h1>
        <h2>Visualize abaixo os dados sobre sua plantação de café arábica</h2>

        <!-- KPIs -->
        <div class="kpis">
            <div class="kpi">
                <h3>Talhões sem leitura recente</h3>
                <span id="kpi_talhoes_sem_leitura">0</span>
            </div>
            <div class="kpi">
                <h3>Sensores Ativos vs Inativos</h3>
                <span id="kpi_inativo">0</span>
            </div>
            <div class="kpi">
                <h3>Talhão em Risco</h3>
                <span id="kpi_alertas" style="color: red;">0</span>
            </div>
        </div>

        <br>

        <span style="font-size: 20px;"><b>Selecione o Talhão desejado:</b></span>
        <select oninput="selecionar()" class="selectTalhao" name="sensor" id="select_talhao">
            <option value="#" selected disabled></option>
            <option value="resumo">Resumo</option>
        </select>

        <div class="containerGraficos">
            <div id="graficoTalhao" class="containerSub" style="display: none;">
                <canvas id="graficoBarra"></canvas>
            </div>

            <div class="graficos" id="graficoGeral">
                <canvas id="graficoLinha"></canvas>
            </div>
        </div>
    </div>

</body>

</html>

<script>
b_usuario1.innerHTML = sessionStorage.NOME_USUARIO;
b_usuario2.innerHTML = sessionStorage.NOME_USUARIO;

    if (!sessionStorage.NOME_USUARIO) {
        window.location.href = "login.html";
    }

    var idPropriedade = sessionStorage.ID_PROPRIEDADE;

    carregarTalhoes();
    carregarGraficoGeral(idPropriedade);
    carregarKPIs('resumo');



    // carregarKPIs();


    async function carregarKPIs(idTalhao) {
        console.log(idTalhao)
        try {
            var semLeitura = await (await fetch(`/kpi/talhoes-sem-leitura/${idPropriedade}`)).json();
            document.getElementById("kpi_talhoes_sem_leitura").innerText =
                semLeitura.talhoes_sem_leitura;

            var leitura;
            if (!idTalhao || idTalhao == "resumo") {
                // Aqui mostra a quantidade sensores ativos da propriedade
                sensores = await (await fetch(`/kpi/sensores-status-geral/${idPropriedade}`)).json();
            } else {
                // Aqui eu chamo a rota para filtrar os sensores de cada talhão
                sensores = await (await fetch(`/kpi/sensores-status/${idTalhao}`)).json();
            }

            document.getElementById("kpi_inativo").innerText =
                `${sensores.sensores_ativos} ativos / ${sensores.sensores_inativos} inativos`;

            var risco = await (await fetch(`/kpi/talhoes-em-risco/${idPropriedade}`)).json();
            document.getElementById("kpi_alertas").innerText = risco.length;

        } catch (e) {
            console.error("Erro ao carregar KPIs:", e);
        }
    }
    /*
    NÃO TO CONSEGUINDO SEPARAR OS SELECTS POR TALHAO
    function carregarKpiSensores(idTalhao) {
        fetch(`/kpi/sensores-status/${idTalhao}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById("kpi_sensores").innerText =
                    `${data.sensores_ativos} ativos / ${data.sensores_inativos} inativos`;
            })
            .catch(err => console.error("Erro KPI sensores:", err));
    }
    
    
     ============================
       CARREGAR TALHÕES NO SELECT
       ============================ */

    function carregarTalhoes() {
        fetch(`/talhao/listar/${idPropriedade}`)
            .then(res => res.json())
            .then(lista => {
                var select = document.getElementById("select_talhao");

                lista.forEach(item => {
                    var option = document.createElement("option");
                    option.value = item.id_talhao;
                    option.textContent = item.nome_talhao;
                    select.appendChild(option);
                });
            });

        marcarTalhoesEmRisco()
    }

    /* ============================
       GRÁFICO GERAL
       ============================ */

    function carregarGraficoGeral(idPropriedade) {
        fetch(`/graficoGeral/exibir/${idPropriedade}`)
            .then(r => r.json())
            .then(data => {
                plotarGraficoGeral(idPropriedade, data[0].umidade_media);
            });
    }

    var graficoGeral = null;

    function plotarGraficoGeral(idPropriedade, umidadeInicial) {

        console.log('Iniciando plotagem do gráfico geral...');

        var labels = ["Leitura 1"];

        var dados = {
            labels: labels,
            datasets: [{
                label: 'Umidade Média da Propriedade',
                data: [umidadeInicial],
                borderColor: 'rgb(75, 192, 192)',
                backgroundColor: 'rgb(75, 192, 192)',
                fill: false,
                tension: 0.1
            }]
        };

        const config = {
            type: 'line',
            data: dados,
            options: {
                scales: {
                    y: {
                        min: 0,
                        max: 100
                    }
                }
            }
        };

        var myChart = new Chart(
            document.getElementById("graficoLinha"),
            config
        );

        setTimeout(() =>
            atualizarGraficoGeral(idPropriedade, dados, myChart),
            5000
        );
    }

    function atualizarGraficoGeral(idPropriedade, dados, myChart) {

        fetch(`/graficoGeral/exibir/${idPropriedade}`, { cache: 'no-store' })
            .then(response => response.json())
            .then(novo => {

                var novoValor = novo[0].umidade_media;
                var ultimoValor = dados.datasets[0].data[dados.datasets[0].data.length - 1];

                console.log("Novo valor:", novoValor);
                console.log("Último valor:", ultimoValor);

                if (novoValor != ultimoValor) {

                    dados.labels.push(`Leitura ${dados.labels.length + 1}`);

                    if (dados.datasets[0].data.length >= 10) {
                        dados.datasets[0].data.shift();
                        dados.labels.shift();
                    }

                    dados.datasets[0].data.push(novoValor);
                    myChart.update();
                }

                setTimeout(() =>
                    atualizarGraficoGeral(idPropriedade, dados, myChart),
                    5000
                );
            })
            .catch(erro => {
                console.error("Erro ao atualizar gráfico geral:", erro);
                setTimeout(() =>
                    atualizarGraficoGeral(idPropriedade, dados, myChart),
                    5000
                );
            });
    }


    /* ============================
       GRÁFICO TALHÃO
       ============================ */

    /* ============================
   GRÁFICO TALHÃO (IGUAL AO GERAL)
   ============================ */

var graficoTalhao = null;
var dadosTalhao = null;
var idTalhaoAtual = null;

function carregarGraficoTalhao(idTalhao) {
    idTalhaoAtual = idTalhao;

    fetch(`/graficoTalhao/exibir/${idTalhao}`)
        .then(r => r.json())
        .then(data => {
            plotarGraficoTalhao(data[0].umidade_media);
        })
        .catch(err => console.error("Erro carregar grafico talhao:", err));
}

function plotarGraficoTalhao(umidadeInicial) {

    const ctx = document.getElementById("graficoBarra");

    if (graficoTalhao) graficoTalhao.destroy();

    dadosTalhao = {
        labels: ["Leitura 1"],
        datasets: [{
            label: "Umidade Média do Talhão",
            data: [umidadeInicial],
            borderWidth: 2
        }]
    };

    graficoTalhao = new Chart(ctx, {
        type: "line",
        data: dadosTalhao,
        options: {
            scales: {
                y: { min: 0, max: 100 }
            }
        }
    });

    setTimeout(atualizarGraficoTalhao, 5000);
}

function atualizarGraficoTalhao() {

    fetch(`/graficoTalhao/exibir/${idTalhaoAtual}`, { cache: 'no-store' })
        .then(r => r.json())
        .then(novo => {

            var novoValor = novo[0].umidade_media;
            var ultimoValor = dadosTalhao.datasets[0].data[dadosTalhao.datasets[0].data.length - 1];

            console.log("Novo valor:", novoValor, "| Último valor:", ultimoValor);

            if (novoValor != ultimoValor) {

                dadosTalhao.labels.push(`Leitura ${dadosTalhao.labels.length + 1}`);

                if (dadosTalhao.datasets[0].data.length >= 10) {
                    dadosTalhao.datasets[0].data.shift();
                    dadosTalhao.labels.shift();
                }

                dadosTalhao.datasets[0].data.push(novoValor);

                graficoTalhao.update();
            }

            setTimeout(atualizarGraficoTalhao, 5000);
        })
        .catch(err => {
            console.error("Erro ao atualizar gráfico talhão:", err);
            setTimeout(atualizarGraficoTalhao, 5000);
        });
}

    /* ============================
       ALTERAR ENTRE RESUMO E TALHÃO
       ============================ */

    function selecionar() {
        var valor = select_talhao.value;
        carregarKPIs(valor)

        if (valor === "resumo") {
            document.getElementById("graficoGeral").style.display = "block";
            document.getElementById("graficoTalhao").style.display = "none";
            carregarGraficoGeral(idPropriedade);
        } else {
            carregarGraficoTalhao(Number(valor));
            document.getElementById("graficoGeral").style.display = "none";
            document.getElementById("graficoTalhao").style.display = "block";
        }

    }

    function marcarTalhoesEmRisco() {
        const options = document.querySelectorAll("#select_talhao option");
        // options.forEach(op => {
        // op.style.color = "black";
        // op.style.fontWeight = "normal";
    // });
        fetch(`/kpi/talhoes-em-risco/${idPropriedade}`)
        
            .then(res => res.json())
            .then(talhoesRisco => {
                talhoesRisco.forEach(t => {
                    const option = document.querySelector(`#select_talhao option[value="${t.id_talhao}"]`);
                    if (option && (t.umidade_media < 60 || t.umidade_media > 80)) {
                        option.style.color = "red";
                        option.style.fontWeight = "bold";
                    }
                });

            })
            .catch(err => console.error("Erro ao marcar risco:", err));
    }




    /* ============================
       SELECT DO MENU
       ============================ */

    function select_function() {
        var valor = header_select.value;

        if (valor === "index" || valor === "login") {
            sessionStorage.clear();
            window.location.href = valor + ".html";
        }
    }
</script>
