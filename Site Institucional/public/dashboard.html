<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffech Dashboard</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" href="./imgs/logo-fundo-marrom.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="dashboard">

    <div class="header">
        <div class="container">
            <a href="index.html#"><img src="./imgs/logo-fonte-branca.png" class="titulo"></a>
            <div class="sla">
                <p id="header_nome">Olá, <span id="b_usuario1">usuário</span>!</p>
                <img src="./imgs/fotoperfil.png" class="foto">
                <select oninput="select_function()" class="select-dash" id="header_select">
                    <option selected disabled value="#"></option>
                    <option value="login">Entrar com outra conta</option>
                    <option value="problema">Problemas?</option>
                    <option value="requisicao">Pedidos?</option>
                    <option value="index">Sair</option>
                    
                </select>
            </div>
        </div>
    </div>

    <div class="saudacoes">
        <h1 id="saudacao">Bom dia, <span id="b_usuario2">usuário</span>!</h1>
        <h2>Visualize abaixo os dados sobre sua plantação de café arábica</h2>

        <!-- KPIs -->
        <div class="kpis">
            <div class="kpi">
                <h3>Quantidade de Sensores Ativos<abbr title="Este indica o tempo médio de seca na sua plantação"><img src="./imgs/iconeInformativo.png" alt="" style="width:16px; height:16px; vertical-align:middle; margin-left:5px;"></abbr></h3>
                <span id="kpi_temp">X</span>
            </div>
            <div class="kpi">
                <h3>Quantidade de Sensores Inativos<abbr title="Este indica o tempo médio de seca na sua plantação"><img src="./imgs/iconeInformativo.png" alt="" style="width:16px; height:16px; vertical-align:middle; margin-left:5px;"></abbr></h3>
                <span id="kpi_temp">X</span>
            </div>
            <div class="kpi">
                <h3>Talhão em Risco <abbr title="Quantidade de talhões fora da umidade ideal"><img src="./imgs/iconeInformativo.png" alt="" style="width:16px; height:16px; vertical-align:middle; margin-left:5px;"></abbr></h3>
                <span id="kpi_alertas" style="color: red;">1</span>
            </div>
        </div>
     
        <br>
    
        <span style="font-size: 20px;"><b>Selecione o Talhão desejado:</b></span>
        <select oninput="selecionar()" class="selectTalhao" name="sensor" id="select_talhao">
            <option value="#" selected disabled></option>
            <option value="resumo">Resumo</option>
            <!-- <option value="1">Talhão 1</option>
            <option value="2">Talhão 2</option> -->
        
        </select>


        <!-- <div id="div_NovoSensor" style="display: none; margin-top: 15px;">
            <span>Digite o código do Talhão:</span>
            <input type="text" id="input_sensor"> 
            <button onclick="adicionarSensor()">Adicionar Talhão</button>
        </div> -->

        <!--
            -- Inserir alertas por talhão
            -- Gráfico de Média da propriedade com aviso sobre risco de média
            -- Gráfico de medida por talhão
        -->

        <div class="containerGraficos">

            <!-- Gráficos Sensor 2 -->
            <div id="graficoTalhao" class="containerSub" style="display: none;">
                <div class="graficos2">
                    <canvas id="graficoBarra"></canvas>
                </div>
            </div>
            <div class="graficos" id="graficoGeral">
                <div><canvas id="graficoLinha"></canvas></div>
                <div id="div_sensores"></div>
            </div>
        </div>
    </div>
</body>

</html>

<script>
    b_usuario1.innerHTML = sessionStorage.NOME_USUARIO;
    b_usuario2.innerHTML = sessionStorage.NOME_USUARIO;


    if (!sessionStorage.NOME_USUARIO) {
        window.location.href = "login.html";
    }

    var idPropriedade = sessionStorage.id_propriedade; 

carregarGraficoGeral(idPropriedade);
carregarTalhoes();


function carregarTalhoes() {
    fetch(`/talhao/listar/${idPropriedade}`)
        .then(res => res.json())
        .then(lista => {

            var select = document.getElementById("select_talhao");

            for (var i = 0; i < lista.length; i++) {
                var item = lista[i];

                var option = document.createElement("option");
                option.value = item.id_talhao;
                option.textContent = item.nome_talhao;

                select.appendChild(option);
            }

        });
}


function carregarGraficoGeral(idPropriedade) {
    fetch(`/graficoGeral/exibir/${idPropriedade}`, { cache: "no-store" })
        .then(response => {
            if (response.ok) return response.json();
            else console.error("Erro ao buscar dados");
        })
        .then(data => {
            console.log("Dados recebidos (geral):", data);

            var umidadeMedia = data[0].umidade_media;

            plotarGraficoGeral(idPropriedade, umidadeMedia);
        })
        .catch(erro => console.error("Erro:", erro));
}

function avaliarSaude(umidade) {
    if (umidade >= 60 && umidade <= 75) return "Ótima";
    if (umidade < 60) return "Baixa";
    return "Alta demais";
}

function plotarGraficoGeral(idPropriedade, umidadeInicial) {

    console.log('Iniciando plotagem do gráfico geral...');

    let labels = ["Leitura 1"];

    let dados = {
        labels: labels,
        datasets: [{
            label: 'Umidade Média da Propriedade',
            data: [umidadeInicial],
            borderColor: 'rgb(75, 192, 192)',
            backgroundColor: 'rgb(75, 192, 192)',
            fill: false,
            tension: 0.1
        }]
    };

    const config = {
        type: 'line',
        data: dados,
        options: {
        scales: {
            y: {
                min: 0,
                max: 100
            }
        }
    }
    };

    let myChart = new Chart(
        document.getElementById("graficoLinha"),
        config
    );

    setTimeout(() => 
        atualizarGraficoGeral(idPropriedade, dados, myChart), 
        5000
    );
}


function select_function() {
    var select = document.getElementById("header_select");
    var options = select.options;

    for (var i = 0; i < options.length; i++) {
        if (options[i].selected) {
            if (options[i].value === "index") {
                sessionStorage.clear();
                window.location.href = "index.html";
            } else if (options[i].value === "login") {
                sessionStorage.clear();
                window.location.href = "login.html";
            } else if (options[i].value === "problema") {
                sessionStorage.clear();
                window.location.href = "https://coffechinc.atlassian.net/jira/software/form/5964626c-d758-4dc4-a0c0-e069abe43b57?atlOrigin=eyJpIjoiMWM4N2JhZDc5YWJlNGYyNzkyMWFmMjIzN2I2NzM0ODQiLCJwIjoiaiJ9";
            } else if (options[i].value === "requisicao") {
                sessionStorage.clear();
                window.location.href = "https://coffechinc.atlassian.net/jira/software/form/f4236487-a1f5-4d21-937f-cba31eb0bc6e?atlOrigin=eyJpIjoiYjE1NGVlNTExODBmNDA3Y2IzMjA2NmY4MGJiZTAyNTAiLCJwIjoiaiJ9";
            }
        }
    
    };

}



function atualizarGraficoGeral(idPropriedade, dados, myChart) {

    fetch(`/graficoGeral/exibir/${idPropriedade}`, { cache: 'no-store' })
        .then(response => response.json())
        .then(novo => {

            let novoValor = novo[0].umidade_media;
            let ultimoValor = dados.datasets[0].data[dados.datasets[0].data.length - 1];

            console.log("Novo valor:", novoValor);
            console.log("Último valor:", ultimoValor);

            if (novoValor != ultimoValor) {

                dados.labels.push(`Leitura ${dados.labels.length + 1}`);

                if (dados.datasets[0].data.length >= 10) {
                    dados.datasets[0].data.shift();
                    dados.labels.shift();
                }

                dados.datasets[0].data.push(novoValor);
                myChart.update();
            }

            setTimeout(() => 
                atualizarGraficoGeral(idPropriedade, dados, myChart), 
                5000
            );
        })
        .catch(erro => {
            console.error("Erro ao atualizar gráfico geral:", erro);
            setTimeout(() => 
                atualizarGraficoGeral(idPropriedade, dados, myChart), 
                5000
            );
        });
}

function selecionar(){
    var selecionado = document.getElementById('select_talhao')
    var valor = selecionado.value


    for (var i = 0; i < selecionado.options.length; i++) {
        var opcao = selecionado.options[i].value;

        if (opcao == valor) {
            if (opcao == "resumo") {
                carregarGraficoGeral();
                mostrarGraficoGeral();
            } else {
                carregarGraficoTalhao(Number(opcao));
                mostrarGraficoTalhao()
            }
            break; 
        }
    }
}

function carregarGraficoTalhao(idTalhao) {

    fetch(`/graficoTalhao/exibir/${idTalhao}`)
        .then(res => res.json())
        .then(data => {
            console.log("Dados desse talhão:", data);

            var umidade = data[0].umidade_media;

            plotarGraficoTalhao(umidade);
        })
        .catch(e => console.error("Erro ao buscar dados do talhão:", e));
}

let graficoTalhao = null;

function plotarGraficoTalhao(umidade) {

    var graficoBarra = document.getElementById("graficoBarra");

    if (graficoTalhao != null) {
        graficoTalhao.destroy();
    }

    graficoTalhao = new Chart(graficoBarra, {
        type: "bar",
        data: {
            labels: ["Leitura 1"],
            datasets: [{
                label: "Umidade média do talhão",
                data: [umidade],
                borderWidth: 2
            }]
        },
        options: {
            scales: {
                y: {
                    min: 0,
                    max: 100
                }
            }
        }
    });
}

function mostrarGraficoGeral() {
    document.getElementById("graficoGeral").style.display = "block";
    document.getElementById("graficoTalhao").style.display = "none";
}

function mostrarGraficoTalhao() {
    document.getElementById("graficoGeral").style.display = "none";
    document.getElementById("graficoTalhao").style.display = "block";
}

</script>
