<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffech Dashboard</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" href="./imgs/logo-fundo-marrom.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="dashboard">

    <div class="header">
        <div class="container">
            <a href="index.html#"><img src="./imgs/logo-fonte-branca.png" class="titulo"></a>
            <div class="sla">
                <p id="header_nome">Olá!</p>
                <img src="./imgs/fotoperfil.png" class="foto">
                <select oninput="select_function()" class="select-dash" id="header_select">
                    <option selected disabled value="#"></option>
                    <option value="login">Entrar com outra conta</option>
                    <option value="index">Sair</option>
                </select>
            </div>
        </div>
    </div>

    <div class="saudacoes">
        <h1 id="saudacao">Bom dia!</h1>
        <h2>Visualize abaixo os dados sobre sua plantação de café arábica</h2>

        <!-- KPIs -->
        <div class="kpis">
            <div class="kpi">
                <h3>Umidade Média</h3>
                <span id="kpi_umidade">--</span>
            </div>
            <div class="kpi">
                <h3>Período de Seca</h3>
                <span id="kpi_temp">--</span>
            </div>
            <div class="kpi">
                <h3>Alertas de risco</h3>
                <span id="kpi_alertas">--</span>
            </div>
            <div class="kpi">
                <h3>Saúde da Plantação</h3>
                <span id="kpi_saude">--</span>
            </div>
        </div>

        <br>
        <span><b>Selecione o Talhão desejado:</b></span>
        <select class="selectTalhao" id="select_sensor">
            <option value="#" selected disabled></option>
            <option value="resumo">Resumo</option>
        </select>

        <div class="containerGraficos">
            <div id="div_grafico1" class="containerSub" style="display:none;">
                <div class="graficos1"><canvas id="graficoLinha1"></canvas></div>
                <div class="graficos2"><canvas id="graficoBarra1"></canvas></div>
            </div>
            <div class="graficos">
                <canvas id="graficoGeral"></canvas>
            </div>
        </div>
    </div>
</body>

</html>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const usuario = JSON.parse(localStorage.getItem("usuario"));

    if (!usuario) {
        window.location.href = "login.html";
        return;
    }

    document.getElementById("header_nome").textContent = `Olá, ${usuario.nome_usuario}`;
    document.getElementById("saudacao").textContent = `Bom dia, ${usuario.nome_usuario}!`;

    if (!usuario.fk_empresa) {
        console.error("Empresa não definida");
        return;
    }

    carregarDashboard(usuario.fk_empresa);

    document.getElementById("select_sensor").addEventListener("change", e => selecionarTalhao(usuario.fk_empresa, e.target.value));
});

async function carregarDashboard(idEmpresa) {
    try {
        const res = await fetch(`/propriedades/${idEmpresa}/dashboard`);
        const data = await res.json();
        renderizarKPIs(data);
        renderizarGraficoGeral(data.medias_talhoes);
        renderizarListaTalhoes(data.medias_talhoes);
    } catch (err) {
        console.error(err);
    }
}

async function selecionarTalhao(idEmpresa, talhaoId) {
    if (talhaoId === "resumo") return carregarDashboard(idEmpresa);
    try {
        const res = await fetch(`/talhao/${talhaoId}/leituras/historico`);
        const data = await res.json();
        // renderizar gráficos específicos do talhão
    } catch (err) {
        console.error(err);
    }
}

function renderizarKPIs(data) {
    const medias = data.medias_talhoes.map(t => t.media_umidade);
    const mediaGeral = medias.length ? (medias.reduce((a,b)=>a+b)/medias.length).toFixed(1) : 0;

    document.getElementById("kpi_umidade").textContent = mediaGeral + "%";
    document.getElementById("kpi_temp").textContent = "--";
    document.getElementById("kpi_alertas").textContent = data.total_alertas;
    document.getElementById("kpi_saude").textContent = avaliarSaude(mediaGeral);
}

function renderizarListaTalhoes(lista) {
    const select = document.getElementById("select_sensor");
    [...select.options].forEach(opt => { if(opt.value!=='resumo') opt.remove(); });
    lista.forEach(t => {
        const option = document.createElement("option");
        option.value = t.id_talhao;
        option.innerText = `Talhão ${t.id_talhao}`;
        select.appendChild(option);
    });
}

function renderizarGraficoGeral(listaTalhoes) {
    const ctx = document.getElementById("graficoGeral").getContext("2d");
    const labels = listaTalhoes.map(t => t.nome_talhao);
    const valores = listaTalhoes.map(t => t.media_umidade);

    new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets: [{ label: 'Umidade Média (%)', data: valores, backgroundColor: '#C08558' }] }
    });
}

function avaliarSaude(umidade) {
    if (umidade >= 60 && umidade <= 75) return "Ótima";
    if (umidade < 60) return "Baixa";
    return "Alta demais";
}

function select_function() {
    const select = document.getElementById("header_select").value;
    if (select === "index") window.location.href = "index.html";
    else if (select === "login") window.location.href = "login.html";
}
</script>
